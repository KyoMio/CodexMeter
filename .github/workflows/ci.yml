name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate (detekt + unit tests + golden screenshots + assembleDebug + compileReleaseKotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same as release.yml: skip the action's obsolete default package list
          # ("tools platform-tools" — the legacy `tools` archive fails to install on a
          # clean SDK) and install the required packages explicitly below.
          packages: ''

      - name: Install SDK platform & build-tools
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOTE: the Roborazzi golden baselines were recorded on macOS; Linux font
      # rasterization differs, so verifyRoborazziDebug may report pixel diffs on
      # first CI runs. If that happens, re-record baselines on the CI image
      # (documented in RULES.md section 19) rather than weakening the gate.
      - name: Gradle quality gate
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
        run: ./gradlew detekt testDebugUnitTest verifyRoborazziDebug assembleDebug :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Upload Roborazzi failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: |
            app/src/test/roborazzi/*_compare.png
            app/src/test/roborazzi/*_actual.png
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Control CLI checks
        run: node --check scripts/control-codexmeter.mjs && node --test scripts/control-codexmeter.test.mjs

      - name: DESIGN.md lint
        run: npx -y @google/design.md@0.4.0 lint DESIGN.md
